
media:
  input: media
  output: /media

content:
  - name: pages
    label: Pages du site
    type: collection
    path: content/pages
    format: json
    filename: "{primary}.json"
    view:
      primary: titre
    fields:
      - name: titre
        label: Titre de la page
        type: string
        required: true
      - name: texte
        label: Texte de la page
        type: rich-text
      - name: image
        label: Image principale
        type: image

  - name: plannings
    label: Plannings et randonnées
    type: collection
    path: content/plannings
    format: json
    filename: "{primary}.json"
    view:
      primary: titre
    fields:
      - name: titre
        label: Titre du planning
        type: string
        required: true
      - name: fichier
        label: Planning PDF
        type: file
      - name: gpx
        label: Parcours GPX
        type: file
      - name: photos
        label: Photos de la randonnée
        type: image
        options:
          multiple: true
      - name: documents
        label: Documents PDF complémentaires
        type: file
        options:
          multiple: true

  - name: ag2026
    label: Assemblée générale 2026
    type: collection
    path: content/ag2026
    format: json
    filename: "{primary}.json"
    view:
      primary: titre
    fields:
      - name: titre
        label: Titre du document
        type: string
        required: true
      - name: fichier
        label: Document PDF ou Word
        type: file

  - name: conseil
    label: Conseil d'administration
    type: collection
    path: content/conseil
    format: json
    filename: "{primary}.json"
    view:
      primary: titre
    fields:
      - name: titre
        label: Titre du document
        type: string
        required: true
      - name: fichier
        label: Document PDF ou Word
        type: file

  - name: bureau
    label: Le Bureau
    type: collection
    path: content/bureau
    format: json
    filename: "{primary}.json"
    view:
      primary: nom
    fields:
      - name: nom
        label: Nom et prénom
        type: string
        required: true
      - name: fonction
        label: Fonction au sein du club
        type: string
        required: true
      - name: telephone
        label: Téléphone
        type: string
      - name: photo
        label: Photo du membre
        type: image

  - name: animateurs
    label: Animateurs
    type: collection
    path: content/animateurs
    format: json
    filename: "{primary}.json"
    view:
      primary: nom
    fields:
      - name: nom
        label: Nom et prénom
        type: string
        required: true
      - name: telephone
        label: Téléphone
        type: string
        required: true

  - name: photos
    label: Albums photos RCC
    type: collection
    path: content/photos
    format: json
    filename: "{primary}.json"
    view:
      primary: titre
    fields:
      - name: titre
        label: Nom de la sortie
        type: string
        required: true
      - name: date
        label: Date de la sortie
        type: date
      - name: image
        label: Photo de couverture
        type: image
        required: true
      - name: galerie
        label: Toutes les photos de l'album
        type: image
        options:
          multiple: true

  - name: festivites
    label: Activités et festivités RCC
    type: collection
    path: content/festivites
    format: json
    filename: "{primary}.json"
    view:
      primary: titre
    fields:
      - name: titre
        label: Nom de l'activité
        type: string
        required: true
      - name: date
        label: Date de l'activité
        type: date
        required: true
      - name: heure
        label: Heure
        type: string
      - name: lieu
        label: Lieu de rendez-vous
        type: string
      - name: description
        label: Programme et informations
        type: rich-text
      - name: tarif
        label: Tarif par personne
        type: string
      - name: date_limite
        label: Date limite d'inscription
        type: date
      - name: image
        label: Photo ou affiche de l'activité
        type: image

  - name: medias
    label: Médias du RCC
    type: collection
    path: content/medias
    format: json
    filename: "{primary}.json"
    view:
      primary: titre
    fields:
      - name: titre
        label: Titre de la vidéo ou musique
        type: string
        required: true
      - name: porte
        label: Porte du site
        type: select
        options:
          values:
            - accueil
            - randonnees
            - cyclotourisme
            - photos
            - festivites
            - forum
      - name: type_media
        label: Type de média
        type: select
        options:
          values:
            - video
            - musique
      - name: emplacement
        label: Où afficher le média ?
        type: string
      - name: fichier
        label: Fichier MP4 ou MP3
        type: file
        options:
          extensions: [mp4, mp3]
      - name: lien
        label: Lien YouTube ou musique en ligne
        type: string


  - name: apparence
    label: Apparence du site
    type: file
    path: content/apparence/accueil.json
    format: json
    fields:
      - name: titre
        label: Titre du site
        type: string
      - name: slogan
        label: Slogan du site
        type: string
      - name: couleur
        label: Couleur principale
        type: string
      - name: ambiance
        label: Ambiance
        type: string
      - name: presentation
        label: Présentation de l'accueil
        type: text
      - name: image_accueil
        label: Image d'accueil
        type: image

  - name: contacts
    label: Coordonnées du club
    type: file
    path: content/contacts/coordonnees.json
    format: json
    fields:
      - name: president
        label: Nom du président
        type: string
      - name: telephone
        label: Téléphone du club
        type: string
      - name: email
        label: Adresse e-mail
        type: string
      - name: adresse
        label: Adresse postale du club
        type: string
