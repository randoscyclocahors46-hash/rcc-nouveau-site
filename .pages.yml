
media:
  input: media
  output: /media

content:
  - name: pages
    label: Pages du site
    type: collection
    path: content/pages
    format: json
    filename: "{primary}.json"
    view:
      primary: titre
    fields:
      - name: titre
        label: Titre de la page
        type: string
        required: true
      - name: texte
        label: Texte de la page
        type: rich-text
      - name: image
        label: Image principale
        type: image
  - name: plannings
    label: Plannings PDF
    type: collection
    path: content/plannings
    format: json
    filename: "{primary}.json"
    view:
      primary: titre
    fields:
      - name: titre
        label: Titre du planning
        type: string
        required: true
      - name: fichier
        label: Document PDF
        type: file
          - name: photos
    label: Photos RCC
    type: collection
    path: content/photos
    format: json
    filename: "{primary}.json"
    view:
      primary: titre
    fields:
      - name: titre
        label: Titre de la photo
        type: string
        required: true
      - name: image
        label: Photo
        type: image
        required: true
