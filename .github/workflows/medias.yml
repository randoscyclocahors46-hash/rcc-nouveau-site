
name: Mise à jour automatique des médias RCC

on:
  push:
    branches:
      - main
    paths:
      - 'content/medias/**'
      - '.github/workflows/medias.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  creer-liste-medias:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Créer la liste des médias
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          dossier = Path("content/medias")
          medias = []

          for fichier in sorted(dossier.glob("*.json")):
              with fichier.open(encoding="utf-8") as f:
                  medias.append(json.load(f))

          sortie = Path("content/medias.json")
          sortie.write_text(
              json.dumps(medias, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Enregistrer la liste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/medias.json
          git diff --cached --quiet || (git commit -m "Mise à jour de la liste des médias" && git push)
